<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#160d1c" />
    <meta name="description" content="Bloom — grow flowers from words, photograph them, and keep them in a journal with friends." />
    <title>bloom</title>
    <script>
      // Apply the saved website theme before the page draws (no flash).
      try {
        var t = localStorage.getItem("bloom.theme") || "midnight";
        if (t === "auto") t = matchMedia("(prefers-color-scheme: dark)").matches ? "midnight" : "paper";
        if (["midnight", "y2k", "paper", "fairy"].indexOf(t) < 0) t = "midnight";
        document.documentElement.dataset.theme = t;
      } catch (e) {
        document.documentElement.dataset.theme = "midnight";
      }
    </script>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=DM+Mono:wght@400;500&family=Silkscreen&family=Figtree:wght@400;500;600;700&family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,560;1,9..144,400;1,9..144,500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <noscript>Bloom needs JavaScript to grow its flowers.</noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
