<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bloom — studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- The watercolor edge used by the paint dabs -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <filter id="watercolor">
      <feTurbulence type="fractalNoise" baseFrequency="0.05" numOctaves="2" seed="4"/>
      <feDisplacementMap in="SourceGraphic" scale="7"/>
    </filter>
  </svg>

  <header class="site-header">
    <a class="wordmark" href="studio.html">
      <svg class="wordmark-flower" viewBox="0 0 40 44" aria-hidden="true">
        <path d="M20 22 C20 31 18 36 13 42" class="sprig-stem"/>
        <path d="M18 33 C12 33 9 29 9 26 C14 26 17 29 18 33Z" class="sprig-leaf"/>
        <g class="flower-petals">
          <ellipse cx="20" cy="9.5" rx="3.8" ry="6"/>
          <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(72 20 16)"/>
          <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(144 20 16)"/>
          <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(216 20 16)"/>
          <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(288 20 16)"/>
        </g>
        <circle cx="20" cy="16" r="2.8" class="flower-heart"/>
      </svg>
      <span>bloom</span>
    </a>
    <nav class="site-nav">
      <a href="studio.html" class="is-current">Studio</a>
      <a href="gallery/index.html">Gallery</a>
      <span class="nav-user"><span data-user-name></span>’s journal</span>
      <button type="button" class="link-button" data-sign-out>Sign out</button>
    </nav>
  </header>

  <main class="studio">
    <section class="journal-card controls">
      <p class="eyebrow">The studio</p>
      <h1>Grow a flower from a word</h1>

      <form id="grow-form">
        <label class="field">
          <span class="label">A word to grow</span>
          <input id="word" class="word-input" type="text" maxlength="20" required autocomplete="off" placeholder="love, home, you…">
        </label>

        <fieldset class="paints">
          <legend class="label">Paints</legend>
          <div class="dabs">
            <label class="dab"><input type="color" id="ring1"><span class="paint"></span><span class="dab-name">Center</span></label>
            <label class="dab"><input type="color" id="ring2"><span class="paint"></span><span class="dab-name">Ring 2</span></label>
            <label class="dab"><input type="color" id="ring3"><span class="paint"></span><span class="dab-name">Ring 3</span></label>
            <label class="dab"><input type="color" id="ring4"><span class="paint"></span><span class="dab-name">Ring 4</span></label>
            <label class="dab"><input type="color" id="ring5"><span class="paint"></span><span class="dab-name">Outer</span></label>
            <label class="dab"><input type="color" id="green"><span class="paint"></span><span class="dab-name">Stem &amp; leaves</span></label>
            <label class="dab"><input type="color" id="hearts"><span class="paint"></span><span class="dab-name">Hearts</span></label>
            <label class="dab"><input type="color" id="background"><span class="paint"></span><span class="dab-name">Canvas</span></label>
          </div>
        </fieldset>

        <div class="form-actions">
          <button type="submit" class="button rose">Grow my flower</button>
          <button type="button" id="reset-paints" class="link-button">Original paints</button>
        </div>
      </form>
    </section>

    <section class="artwork">
      <div class="frame">
        <span class="tape tape-left" aria-hidden="true"></span>
        <span class="tape tape-right" aria-hidden="true"></span>
        <canvas id="flower-canvas" aria-label="Your flower"></canvas>
      </div>
      <p class="caption" id="caption">Type a word and press <em>Grow my flower</em>.</p>
      <div class="artwork-actions">
        <button type="button" id="save" class="button sage" disabled>Save to gallery</button>
        <button type="button" id="download" class="button quiet" disabled>Download PNG</button>
      </div>
      <p class="toast" id="toast" role="status"></p>
    </section>
  </main>

  <script src="js/journal.js"></script>
  <script src="js/flower.js"></script>
  <script src="js/studio.js"></script>
</body>
</html>
