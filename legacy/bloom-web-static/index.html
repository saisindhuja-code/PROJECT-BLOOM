<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>bloom — sign in</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Karla:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body class="welcome-page">

  <main class="welcome">
    <div class="journal-card welcome-card">
      <svg class="corner-sprig" viewBox="0 0 90 90" aria-hidden="true">
        <path d="M6 84 C30 62 48 40 82 8" class="sprig-stem"/>
        <path d="M30 60 C20 56 16 48 17 42 C26 45 31 52 30 60Z" class="sprig-leaf"/>
        <path d="M44 45 C52 46 58 41 60 34 C51 33 46 38 44 45Z" class="sprig-leaf"/>
        <path d="M58 30 C50 28 47 21 48 15 C56 18 59 24 58 30Z" class="sprig-leaf"/>
        <circle cx="82" cy="8" r="4" class="sprig-bud"/>
      </svg>

      <a class="wordmark wordmark-large" href="index.html">
        <svg class="wordmark-flower" viewBox="0 0 40 44" aria-hidden="true">
          <path d="M20 22 C20 31 18 36 13 42" class="sprig-stem"/>
          <path d="M18 33 C12 33 9 29 9 26 C14 26 17 29 18 33Z" class="sprig-leaf"/>
          <g class="flower-petals">
            <ellipse cx="20" cy="9.5" rx="3.8" ry="6"/>
            <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(72 20 16)"/>
            <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(144 20 16)"/>
            <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(216 20 16)"/>
            <ellipse cx="20" cy="9.5" rx="3.8" ry="6" transform="rotate(288 20 16)"/>
          </g>
          <circle cx="20" cy="16" r="2.8" class="flower-heart"/>
        </svg>
        <span>bloom</span>
      </a>
      <p class="tagline">a little journal of flowers grown from words</p>

      <div class="tabs" role="tablist">
        <button type="button" class="tab is-active" data-tab="signin" role="tab" aria-selected="true">Sign in</button>
        <button type="button" class="tab" data-tab="signup" role="tab" aria-selected="false">Start a journal</button>
      </div>

      <form id="signin-form" class="auth-form">
        <label class="field">
          <span class="label">Your name</span>
          <input name="name" type="text" autocomplete="username" required>
        </label>
        <label class="field">
          <span class="label">Password</span>
          <input name="password" type="password" autocomplete="current-password" required>
        </label>
        <button type="submit" class="button rose">Open my journal</button>
      </form>

      <form id="signup-form" class="auth-form" hidden>
        <label class="field">
          <span class="label">Pick a name</span>
          <input name="name" type="text" autocomplete="username" maxlength="20" required>
        </label>
        <label class="field">
          <span class="label">Password <small>(6+ characters)</small></span>
          <input name="password" type="password" autocomplete="new-password" required>
        </label>
        <label class="field">
          <span class="label">Password, once more</span>
          <input name="confirm" type="password" autocomplete="new-password" required>
        </label>
        <button type="submit" class="button rose">Start my journal</button>
      </form>

      <p class="form-message" id="message" role="alert"></p>
      <p class="fine-print">Your journal is kept in this browser only. Nothing is sent anywhere.</p>
    </div>
  </main>

  <script src="js/journal.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
